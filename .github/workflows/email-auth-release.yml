name: Email auth release image (manual)

# No timer, webhook or automatic deployment. This workflow never reaches the VPS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-auth-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the exact release commit
        working-directory: services/email-auth
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m compileall -q portal.py smoke.py candidate.py test_portal.py app.py test_app.py test_release.py deploy/release.py
          python3 -m unittest -v
      - name: Build and publish immutable-commit image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wbandozon-email-auth"
          tag="$image:sha-$GITHUB_SHA"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$tag" services/email-auth
          name="email-auth-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --memory=128m --cpus=.5 --pids-limit=100 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001 \
            "$tag" python candidate.py >/dev/null
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$name" python smoke.py; then
              ready=1; break
            fi
            sleep 1
          done
          [[ "$ready" == 1 ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$tag"
          digest="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ ^ghcr\.io/[a-z0-9_.-]+/wbandozon-email-auth@sha256:[0-9a-f]{64}$ ]]
          printf 'Image: `%s`\n\nCommit: `%s`\n\nNot deployed. Review digest and run the separately provisioned deployer only after runtime setup.\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
