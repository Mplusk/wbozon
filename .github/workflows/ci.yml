name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python -m pip check
      - name: Verify Python syntax
        run: .venv/bin/python -m compileall -q bot calc collectors daily demand deploy gates gateway operations pipeline production reports scout storage workcycle marketplace_check.py test_*.py
      - name: Check JSON inputs
        run: |
          python3 -m json.tool config/production.yaml > /dev/null
          for file in examples/*.json products/*/*.json; do
            python3 -m json.tool "$file" > /dev/null
          done
      - name: Run offline tests
        run: .venv/bin/python -m unittest -v
