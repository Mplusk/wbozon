name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify Python syntax
        run: python3 -m compileall -q calc collectors daily demand deploy operations pipeline production reports scout storage workcycle marketplace_check.py test_*.py
      - name: Check JSON inputs
        run: |
          python3 -m json.tool config/production.yaml > /dev/null
          for file in examples/*.json products/*/*.json; do
            python3 -m json.tool "$file" > /dev/null
          done
      - name: Run offline tests
        run: python3 -m unittest -v

  email-auth:
    name: Email auth tests and isolated smoke
    needs: [verify, native-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Syntax and offline security regressions
        working-directory: services/email-auth
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m compileall -q portal.py smoke.py candidate.py test_portal.py app.py gunicorn.conf.py test_app.py test_release.py deploy/release.py
          python3 -m unittest -v
      - name: Build isolated runtime
        run: docker build --tag email-auth-unified-ci services/email-auth
      - name: Smoke test with synthetic credentials and no network
        shell: bash
        run: |
          set -euo pipefail
          name="email-auth-unified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --memory=128m --cpus=.5 --pids-limit=100 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001 \
            --network none \
            email-auth-unified-ci python candidate.py >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$name" python smoke.py >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Isolated runtime did not become ready' >&2
          exit 1
      - name: Package tested image for private review
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          docker save email-auth-unified-ci | gzip -n > image-artifact/email-auth-image.tar.gz
          (cd image-artifact && sha256sum email-auth-image.tar.gz > SHA256SUMS)
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' email-auth-unified-ci)"
          export IMAGE_ID
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "source_commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "image_id": os.environ["IMAGE_ID"],
              "platform": "linux/amd64",
              "purpose": "review and isolated testing only; not deployed",
          }
          Path("image-artifact/metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - name: Retain tested image as a private workflow artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: email-auth-tested-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  native-release:
    name: Native release controller tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run offline controller tests
        working-directory: tools/native-release
        run: |
          python3 -m py_compile native_release.py test_native_release.py
          python3 -m unittest -v
      - name: Test encrypted database backups
        working-directory: tools/yandex-backup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age python3-cryptography
          sudo python3 -B -m unittest -v

  marketplace-egress:
    name: Marketplace egress proxy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test proxy with synthetic traffic
        working-directory: tools/marketplace-egress
        run: |
          python3 -m py_compile marketplace_proxy.py test_marketplace_proxy.py
          python3 -m unittest -v

  native-candidate:
    name: Build and test native portal candidate
    if: github.event_name == 'push'
    needs: [email-auth, marketplace-egress]
    runs-on: ubuntu-24.04
    # Exercise each admitted transition and same-release recovery under systemd.
    timeout-minutes: 65
    outputs:
      artifact_id: ${{ steps.native_artifact.outputs.artifact-id }}
      artifact_attempt: ${{ github.run_attempt }}
      artifact_sha256: ${{ steps.native_digest.outputs.sha256 }}
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Reconstruct source and hash-locked wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c 'import platform,sys; assert sys.version_info[:2] == (3,12); assert platform.machine() == "x86_64"'
          bundle="$RUNNER_TEMP/native-candidate"
          mkdir -p "$bundle/service" "$bundle/wheelhouse" "$bundle/bootstrap" "$RUNNER_TEMP/native-artifact"
          git -c core.autocrlf=false archive "$GITHUB_SHA" services/email-auth | tar -x -C "$bundle/service" --strip-components=2
          cp tools/native-test-bundle/requirements-offline.lock "$bundle/requirements-offline.lock"
          cp tools/native-test-bundle/requirements-bootstrap.lock "$bundle/requirements-bootstrap.lock"
          cp tools/native-test-bundle/test_native.py "$bundle/test_native.py"
          python3 -m pip download --isolated --index-url https://pypi.org/simple \
            --only-binary=:all: --require-hashes --no-deps \
            --dest "$bundle/bootstrap" -r "$bundle/requirements-bootstrap.lock"
          python3 -m pip download --isolated --index-url https://pypi.org/simple \
            --only-binary=:all: --require-hashes --no-deps \
            --dest "$bundle/wheelhouse" -r "$bundle/requirements-offline.lock"
      - name: Test native runtime using the packaged wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/native-candidate"
          venv="$RUNNER_TEMP/native-candidate-venv"
          # Production may lack ensurepip; bootstrap from a separate hash-locked wheel.
          python3 -m venv --without-pip --copies "$venv"
          "$venv/bin/python" -c 'import runpy,sys; sys.path.insert(0,sys.argv.pop(1)); runpy.run_module("pip",run_name="__main__")' \
            "$bundle/bootstrap/pip-26.3-py3-none-any.whl" install --isolated --no-index --find-links "$bundle/wheelhouse" \
            --require-hashes -r "$bundle/requirements-offline.lock"
          (cd "$bundle/service" && PYTHONDONTWRITEBYTECODE=1 "$venv/bin/python" -m unittest -q)
          (cd "$bundle/service" && PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$GITHUB_WORKSPACE/tools/native-release" "$venv/bin/python" - <<'PY'
          import unittest
          from build_release import CATALOG_HOST_TESTS
          loader = unittest.TestLoader()
          for name in CATALOG_HOST_TESTS:
              if not loader.loadTestsFromName(name).countTestCases() or loader.errors:
                  raise SystemExit(f"Missing production check: {name}")
          PY
          )
          PYTHONDONTWRITEBYTECODE=1 "$venv/bin/python" "$bundle/test_native.py"
      - name: Exercise draining and crash recovery on a separate local systemd portal
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/rollback-baseline"
          candidate="$RUNNER_TEMP/reviewed-fbo"
          adoption="$RUNNER_TEMP/first-adoption"
          previous="$RUNNER_TEMP/previous-fbo"
          baseline_ref=824d84a053134e06dac96aacb7a527401e50ab74
          reviewed=19bb022125d6230cde06588a8ef6140356552ae8
          packaged="$RUNNER_TEMP/native-candidate/service"
          mkdir "$baseline" "$candidate" "$adoption" "$previous"
          git -c core.autocrlf=false archive "$baseline_ref" services/email-auth | tar -x -C "$baseline" --strip-components=2
          git -c core.autocrlf=false archive "$reviewed" services/email-auth | tar -x -C "$candidate" --strip-components=2
          git -c core.autocrlf=false archive c5f86331fdbe6165394b566d52c79cc878c359f7 services/email-auth | tar -x -C "$adoption" --strip-components=2
          git -c core.autocrlf=false archive 3d0bb1741f19870899c1ea498049a78acc7c99a1 services/email-auth | tar -x -C "$previous" --strip-components=2
          echo "Testing systemd transition $baseline_ref <-> $reviewed"
          # Exercise the packaged service for this transition and retain the reviewed pair as a regression thereafter.
          if [[ "$(git rev-parse "$GITHUB_SHA:services/email-auth")" == "$(git rev-parse "$reviewed:services/email-auth")" ]]; then
            diff -qr "$candidate" "$packaged"
            candidate="$packaged"
            echo "Packaged service from $GITHUB_SHA matches reviewed Git tree $(git rev-parse "$reviewed:services/email-auth")"
          fi
          python3 -B -I tools/native-release/check_finance_transition.py \
            --python "$RUNNER_TEMP/native-candidate-venv/bin/python" \
            --baseline-service "$baseline" --candidate-service "$candidate" --adoption-service "$adoption" \
            --previous-fbo-service "$previous"
          sudo groupadd --system wbozon-release
          sudo install -d -m 0755 /opt/staging-account-acceptance
          sudo cp -a "$RUNNER_TEMP/native-candidate-venv" /opt/staging-account-acceptance/venv
          sudo chmod -R a+rX /opt/staging-account-acceptance/venv
          sudo python3 -u -I tools/native-release/host_acceptance.py \
            --python /opt/staging-account-acceptance/venv/bin/python \
            --baseline-service "$baseline" --candidate-service "$candidate"
          if [[ "$candidate" != "$packaged" ]]; then
            sudo python3 -u -I tools/native-release/host_acceptance.py \
              --python /opt/staging-account-acceptance/venv/bin/python --gate-source "$packaged/finance_gate.py"
          fi
      - name: Measure the packaged reports release against the verified production rollback version
        shell: bash
        run: |
          set -euo pipefail
          reports=b78835f2adf6a09df5828bb2cf6730c93349a96f
          if [[ "$(git rev-parse "$GITHUB_SHA:services/email-auth")" == "$(git rev-parse "$reports:services/email-auth")" ]]; then
            python3 -B -I tools/native-release/check_report_rollback.py \
              --python "$RUNNER_TEMP/native-candidate-venv/bin/python" \
              --packaged-service "$RUNNER_TEMP/native-candidate/service" --evidence-only
          else
            echo "This pinned rollback measurement applies only to the reports service from $reports."
          fi
      - name: Require a safe marketplace bootstrap and bidirectional report rollback
        shell: bash
        run: |
          set -euo pipefail
          cutover="$RUNNER_TEMP/market-cutover"
          baseline=824d84a053134e06dac96aacb7a527401e50ab74
          bridge=3de87e7ffa97d903e7df2a997634a1eaee8f68b5
          reports=146c31eb1f6cd3d74ae5d7e7d8f134a7cf100257
          for ref in "$baseline" "$bridge" "$reports"; do
            mkdir -p "$cutover/$ref/service"
            git -c core.autocrlf=false archive "$ref:services/email-auth" | tar -x -C "$cutover/$ref/service"
          done
          base_dir="$cutover/$baseline"
          bridge_dir="$cutover/$bridge"
          full_dir="$cutover/$reports"
          packaged="$RUNNER_TEMP/native-candidate"
          subtree="$(git rev-parse "$GITHUB_SHA:services/email-auth")"
          if [[ "$subtree" == "$(git rev-parse "$bridge:services/email-auth")" ]]; then bridge_dir="$packaged"; fi
          if [[ "$subtree" == "$(git rev-parse "$reports:services/email-auth")" ]]; then full_dir="$packaged"; fi
          if [[ "$full_dir" != "$packaged" ]]; then
            (cd "$full_dir/service" && PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/native-candidate-venv/bin/python" -m unittest -q)
          fi
          python3 -B tools/native-release/test_market_policy.py "$base_dir" "$bridge_dir" "$full_dir"
          python3 -B -I tools/native-release/check_market_cutover.py \
            --python "$RUNNER_TEMP/native-candidate-venv/bin/python" --baseline-service "$base_dir/service" \
            --bridge-service "$bridge_dir/service" --full-service "$full_dir/service"
          sudo python3 -B -u -I tools/native-release/host_acceptance.py --market-bootstrap \
            --python /opt/staging-account-acceptance/venv/bin/python \
            --baseline-service "$base_dir/service" --candidate-service "$bridge_dir/service"
          sudo python3 -B -u -I tools/native-release/host_acceptance.py --market-reports \
            --python /opt/staging-account-acceptance/venv/bin/python \
            --baseline-service "$bridge_dir/service" --candidate-service "$full_dir/service"
      - name: Verify v2 rollback, archive preservation and fenced systemd recovery
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/market-v2-parent/service"
          deployed="$RUNNER_TEMP/market-v2-deployed/service"
          reports="$RUNNER_TEMP/market-v2-reports/service"
          regional="$RUNNER_TEMP/market-v2-regional/service"
          active="$RUNNER_TEMP/market-v2-active/service"
          mkdir -p "$previous" "$deployed" "$reports" "$regional" "$active"
          git archive fb80d50146f42588ab1c50cd8925e57980306965:services/email-auth | tar -x -C "$previous"
          git archive b151124d70320946c17d22b08b1daa63964018de:services/email-auth | tar -x -C "$deployed"
          git archive 302e47d9673c630176aaafe90eaf715e4986226d:services/email-auth | tar -x -C "$reports"
          git archive 19eb64821718c293b95aef2044f5dcac93cf7760:services/email-auth | tar -x -C "$regional"
          git archive 3fb3b9fbb73b1fe367aa3cc580a00f777c17e44f:services/email-auth | tar -x -C "$active"
          scoped="$RUNNER_TEMP/market-avito/service"
          mkdir -p "$scoped"
          git archive eae44aeb9d182d5529f9cf970d9627b578cc2528:services/email-auth | tar -x -C "$scoped"
          catalogue="$RUNNER_TEMP/market-catalogue/service"
          mkdir -p "$catalogue"
          git archive 26effadc16a75555f002c069a89eeb35df43d876:services/email-auth | tar -x -C "$catalogue"
          live="$RUNNER_TEMP/market-catalogue-production/service"
          mkdir -p "$live"
          git archive 629f6db13c02973015d505be6071b6098f04d414:services/email-auth | tar -x -C "$live"
          recovery="$RUNNER_TEMP/market-report-recovery/service"
          mkdir -p "$recovery"
          git archive 35d33b1996461802baf2b248031115b8e98a4eb8:services/email-auth | tar -x -C "$recovery"
          snapshot="$RUNNER_TEMP/marketplace-verified-snapshots/service"
          mkdir -p "$snapshot"
          git archive ad3047b13e069ce7b8c1836db5a567a4a9dea85a:services/email-auth | tar -x -C "$snapshot"
          order_archive="$RUNNER_TEMP/marketplace-order-archive/service"
          mkdir -p "$order_archive"
          git archive 22cc8f7e1175f53b2c2b0a49ea82ee4533122eba:services/email-auth | tar -x -C "$order_archive"
          finance_costs="$RUNNER_TEMP/marketplace-finance-costs/service"
          mkdir -p "$finance_costs"
          git archive 1c3d5678d25a221bf39c781361e7725d30694717:services/email-auth | tar -x -C "$finance_costs"
          report_workers="$RUNNER_TEMP/marketplace-report-workers/service"
          mkdir -p "$report_workers"
          git archive adce143e7c15c99a6f68dbde27761b0b021ad384:services/email-auth | tar -x -C "$report_workers"
          seller_reports="$RUNNER_TEMP/marketplace-seller-settlements/service"
          mkdir -p "$seller_reports"
          git archive f64e565ac7cb11d6d4113e3a452c40fa187dbce8:services/email-auth | tar -x -C "$seller_reports"
          typed_reports="$RUNNER_TEMP/marketplace-typed-reports/service"
          mkdir -p "$typed_reports"
          git archive 322597742c6aa4670a48d4796a8a2fa8804623ef:services/email-auth | tar -x -C "$typed_reports"
          seller_receipts="$RUNNER_TEMP/marketplace-seller-receipts/service"
          mkdir -p "$seller_receipts"
          git archive 525ab9054c3c2683d2b25032e2b5ca227b445587:services/email-auth | tar -x -C "$seller_receipts"
          resumable_reports="$RUNNER_TEMP/marketplace-resumable-reports/service"
          mkdir -p "$resumable_reports"
          git archive c5a2558817b4969ddea983d88157edf3820d32e2:services/email-auth | tar -x -C "$resumable_reports"
          scoped_reports="$RUNNER_TEMP/marketplace-scoped-reports/service"
          mkdir -p "$scoped_reports"
          git archive b970edd32559dc0445b7b26673153767652bd2e0:services/email-auth | tar -x -C "$scoped_reports"
          prior_service="$RUNNER_TEMP/marketplace-prior-release/service"
          mkdir -p "$prior_service"
          git archive 189ef26ae95a572944ac9213b90774a6f5e7a61e:services/email-auth | tar -x -C "$prior_service"
          production_service="$RUNNER_TEMP/marketplace-production-release/service"
          mkdir -p "$production_service"
          git archive 801cc0e22bcf8c2718f2b3301c16066746b5da60:services/email-auth | tar -x -C "$production_service"
          active_service="$RUNNER_TEMP/marketplace-active-release/service"
          mkdir -p "$active_service"
          git archive dc1cf83880fbdddc7bb30cf5cbb1b4ff36a82768:services/email-auth | tar -x -C "$active_service"
          candidate_base="$RUNNER_TEMP/marketplace-calculator-base/service"
          mkdir -p "$candidate_base"
          git archive bd89da546211a39066fc279c964c23478655e2e1:services/email-auth | tar -x -C "$candidate_base"
          deployed_calculator="$RUNNER_TEMP/marketplace-calculator-deployed/service"
          mkdir -p "$deployed_calculator"
          git archive d091774eae685932afd71e781879f9cb931c593f:services/email-auth | tar -x -C "$deployed_calculator"
          calculator_catalogue="$RUNNER_TEMP/marketplace-calculator-catalogue/service"
          mkdir -p "$calculator_catalogue"
          git archive ad46c43c5774ef67ef030345851f6a7804c900d9:services/email-auth | tar -x -C "$calculator_catalogue"
          calculator_components="$RUNNER_TEMP/marketplace-calculator-components/service"
          mkdir -p "$calculator_components"
          git archive 6b3472ce11a2df31acd7f692bb5189713178bc8b:services/email-auth | tar -x -C "$calculator_components"
          calculator_references="$RUNNER_TEMP/marketplace-calculator-references/service"
          mkdir -p "$calculator_references"
          git archive 2a1df45e8d8f8944e610d445886196242149387e:services/email-auth | tar -x -C "$calculator_references"
          review_replies="$RUNNER_TEMP/marketplace-review-replies/service"
          mkdir -p "$review_replies"
          git archive d71db7c23826914abff3450c794ec71d3b3e69f0:services/email-auth | tar -x -C "$review_replies"
          calculator_editor="$RUNNER_TEMP/marketplace-calculator-editor/service"
          mkdir -p "$calculator_editor"
          git archive 0ba8cce48796554428f46549e9569320b014337e:services/email-auth | tar -x -C "$calculator_editor"
          backup_admin="$RUNNER_TEMP/marketplace-backup-admin/service"
          mkdir -p "$backup_admin"
          git archive 61f98910be81bad48f15d94461832c9345344d7f:services/email-auth | tar -x -C "$backup_admin"
          packaged="$RUNNER_TEMP/native-candidate/service"
          python3 -B -I tools/native-release/check_v2_rollback.py --current-service "$previous" \
            --candidate-service "$deployed" --candidate-commit b151124d70320946c17d22b08b1daa63964018de \
            --next-service "$reports" --next-commit 302e47d9673c630176aaafe90eaf715e4986226d \
            --latest-service "$regional" --latest-commit 19eb64821718c293b95aef2044f5dcac93cf7760 \
            --successor 3fb3b9fbb73b1fe367aa3cc580a00f777c17e44f "$active" \
            --successor eae44aeb9d182d5529f9cf970d9627b578cc2528 "$scoped" \
            --successor 26effadc16a75555f002c069a89eeb35df43d876 "$catalogue" \
            --successor 629f6db13c02973015d505be6071b6098f04d414 "$live" \
            --successor 35d33b1996461802baf2b248031115b8e98a4eb8 "$recovery" \
            --successor ad3047b13e069ce7b8c1836db5a567a4a9dea85a "$snapshot" \
            --successor 22cc8f7e1175f53b2c2b0a49ea82ee4533122eba "$order_archive" \
            --successor 1c3d5678d25a221bf39c781361e7725d30694717 "$finance_costs" \
            --successor adce143e7c15c99a6f68dbde27761b0b021ad384 "$report_workers" \
            --successor f64e565ac7cb11d6d4113e3a452c40fa187dbce8 "$seller_reports" \
            --successor 322597742c6aa4670a48d4796a8a2fa8804623ef "$typed_reports" \
            --successor 525ab9054c3c2683d2b25032e2b5ca227b445587 "$seller_receipts" \
            --successor c5a2558817b4969ddea983d88157edf3820d32e2 "$resumable_reports" \
            --successor b970edd32559dc0445b7b26673153767652bd2e0 "$scoped_reports" \
            --successor 189ef26ae95a572944ac9213b90774a6f5e7a61e "$prior_service" \
            --successor 801cc0e22bcf8c2718f2b3301c16066746b5da60 "$production_service" \
            --successor dc1cf83880fbdddc7bb30cf5cbb1b4ff36a82768 "$active_service" \
            --successor bd89da546211a39066fc279c964c23478655e2e1 "$candidate_base" \
            --successor d091774eae685932afd71e781879f9cb931c593f "$deployed_calculator" \
            --successor ad46c43c5774ef67ef030345851f6a7804c900d9 "$calculator_catalogue" \
            --successor 6b3472ce11a2df31acd7f692bb5189713178bc8b "$calculator_components" \
            --successor 2a1df45e8d8f8944e610d445886196242149387e "$calculator_references" \
            --successor d71db7c23826914abff3450c794ec71d3b3e69f0 "$review_replies" \
            --successor 0ba8cce48796554428f46549e9569320b014337e "$calculator_editor" \
            --successor 61f98910be81bad48f15d94461832c9345344d7f "$backup_admin" \
            --successor "$GITHUB_SHA" "$packaged" --python "$RUNNER_TEMP/native-candidate-venv/bin/python"
          "$RUNNER_TEMP/native-candidate-venv/bin/python" -B -I tools/native-release/check_avito_rollback.py "$active" "$scoped"
          "$RUNNER_TEMP/native-candidate-venv/bin/python" -B -I tools/native-release/check_avito_rollback.py "$scoped" "$packaged" --catalog
          sudo python3 -B -u -I tools/native-release/host_acceptance.py --market-reports --interrupted-finance \
            --python /opt/staging-account-acceptance/venv/bin/python --baseline-service "$previous" --candidate-service "$deployed"
      - name: Verify next release rollback and same-release recovery under systemd
        shell: bash
        run: |
          set -euo pipefail
          deployed="$RUNNER_TEMP/market-v2-deployed/service"
          reports="$RUNNER_TEMP/market-v2-reports/service"
          regional="$RUNNER_TEMP/market-v2-regional/service"
          active="$RUNNER_TEMP/market-v2-active/service"
          packaged="$RUNNER_TEMP/native-candidate/service"
          check_pair() {
            sudo python3 -B -u -I tools/native-release/host_acceptance.py --market-reports --interrupted-finance \
              --python /opt/staging-account-acceptance/venv/bin/python --baseline-service "$1" --candidate-service "$2"
          }
          check_pair "$deployed" "$reports"
          check_pair "$reports" "$reports"
          check_pair "$reports" "$regional"
          check_pair "$regional" "$regional"
          check_pair "$regional" "$active"
          check_pair "$active" "$active"
          scoped="$RUNNER_TEMP/market-avito/service"
          check_pair "$active" "$scoped"
          check_pair "$scoped" "$scoped"
          catalogue="$RUNNER_TEMP/market-catalogue/service"
          check_pair "$scoped" "$catalogue"
          live="$RUNNER_TEMP/market-catalogue-production/service"
          check_pair "$catalogue" "$live"
          recovery="$RUNNER_TEMP/market-report-recovery/service"
          check_pair "$live" "$recovery"
          snapshot="$RUNNER_TEMP/marketplace-verified-snapshots/service"
          check_pair "$recovery" "$snapshot"
          order_archive="$RUNNER_TEMP/marketplace-order-archive/service"
          check_pair "$snapshot" "$order_archive"
          finance_costs="$RUNNER_TEMP/marketplace-finance-costs/service"
          check_pair "$order_archive" "$finance_costs"
          report_workers="$RUNNER_TEMP/marketplace-report-workers/service"
          check_pair "$finance_costs" "$report_workers"
          seller_reports="$RUNNER_TEMP/marketplace-seller-settlements/service"
          check_pair "$report_workers" "$seller_reports"
          typed_reports="$RUNNER_TEMP/marketplace-typed-reports/service"
          check_pair "$seller_reports" "$typed_reports"
          seller_receipts="$RUNNER_TEMP/marketplace-seller-receipts/service"
          check_pair "$typed_reports" "$seller_receipts"
          resumable_reports="$RUNNER_TEMP/marketplace-resumable-reports/service"
          check_pair "$seller_receipts" "$resumable_reports"
          scoped_reports="$RUNNER_TEMP/marketplace-scoped-reports/service"
          check_pair "$resumable_reports" "$scoped_reports"
          prior_service="$RUNNER_TEMP/marketplace-prior-release/service"
          check_pair "$scoped_reports" "$prior_service"
          production_service="$RUNNER_TEMP/marketplace-production-release/service"
          check_pair "$prior_service" "$production_service"
          active_service="$RUNNER_TEMP/marketplace-active-release/service"
          mkdir -p "$active_service"
          git archive dc1cf83880fbdddc7bb30cf5cbb1b4ff36a82768:services/email-auth | tar -x -C "$active_service"
          check_pair "$production_service" "$active_service"
          candidate_base="$RUNNER_TEMP/marketplace-calculator-base/service"
          mkdir -p "$candidate_base"
          git archive bd89da546211a39066fc279c964c23478655e2e1:services/email-auth | tar -x -C "$candidate_base"
          check_pair "$active_service" "$candidate_base"
          deployed_calculator="$RUNNER_TEMP/marketplace-calculator-deployed/service"
          mkdir -p "$deployed_calculator"
          git archive d091774eae685932afd71e781879f9cb931c593f:services/email-auth | tar -x -C "$deployed_calculator"
          check_pair "$candidate_base" "$deployed_calculator"
          calculator_catalogue="$RUNNER_TEMP/marketplace-calculator-catalogue/service"
          mkdir -p "$calculator_catalogue"
          git archive ad46c43c5774ef67ef030345851f6a7804c900d9:services/email-auth | tar -x -C "$calculator_catalogue"
          check_pair "$deployed_calculator" "$calculator_catalogue"
          calculator_components="$RUNNER_TEMP/marketplace-calculator-components/service"
          mkdir -p "$calculator_components"
          git archive 6b3472ce11a2df31acd7f692bb5189713178bc8b:services/email-auth | tar -x -C "$calculator_components"
          check_pair "$calculator_catalogue" "$calculator_components"
          calculator_references="$RUNNER_TEMP/marketplace-calculator-references/service"
          mkdir -p "$calculator_references"
          git archive 2a1df45e8d8f8944e610d445886196242149387e:services/email-auth | tar -x -C "$calculator_references"
          check_pair "$calculator_components" "$calculator_references"
          review_replies="$RUNNER_TEMP/marketplace-review-replies/service"
          mkdir -p "$review_replies"
          git archive d71db7c23826914abff3450c794ec71d3b3e69f0:services/email-auth | tar -x -C "$review_replies"
          check_pair "$calculator_references" "$review_replies"
          calculator_editor="$RUNNER_TEMP/marketplace-calculator-editor/service"
          mkdir -p "$calculator_editor"
          git archive 0ba8cce48796554428f46549e9569320b014337e:services/email-auth | tar -x -C "$calculator_editor"
          check_pair "$review_replies" "$calculator_editor"
          backup_admin="$RUNNER_TEMP/marketplace-backup-admin/service"
          mkdir -p "$backup_admin"
          git archive 61f98910be81bad48f15d94461832c9345344d7f:services/email-auth | tar -x -C "$backup_admin"
          check_pair "$calculator_editor" "$backup_admin"
          check_pair "$backup_admin" "$packaged"
          check_pair "$packaged" "$packaged"
      - name: Package candidate with source provenance and hashes
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/native-candidate"
          out="$RUNNER_TEMP/native-artifact"
          python3 - "$bundle" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha): raise SystemExit('invalid commit')
          meta = {'source_commit':sha, 'repository':os.environ['GITHUB_REPOSITORY'],
                  'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'platform':'linux/amd64', 'python':'3.12',
                  'purpose':'tested native candidate; server installation is not verified'}
          (root/'PROVENANCE.json').write_text(json.dumps(meta,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          files = []
          for path in sorted(root.rglob('*')):
              if path.is_symlink(): raise SystemExit('symlink in candidate')
              if not path.is_file(): continue
              name = path.relative_to(root).as_posix()
              if not re.fullmatch(r'[A-Za-z0-9_./-]+', name): raise SystemExit('unsafe candidate path')
              files.append((hashlib.sha256(path.read_bytes()).hexdigest(), name))
          if not files: raise SystemExit('empty candidate')
          (root/'FILES.sha256').write_text(''.join(f'{digest}  {name}\n' for digest,name in files),encoding='utf-8')
          PY
          (cd "$bundle" && sha256sum --check --strict FILES.sha256 >/dev/null)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C "$bundle" -cf - . | gzip -n > "$out/native-portal-${GITHUB_SHA}.tar.gz"
          (cd "$out" && sha256sum "native-portal-${GITHUB_SHA}.tar.gz" > SHA256SUMS)
      - name: Capture candidate digest for the staging job
        id: native_digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum "$RUNNER_TEMP/native-artifact/native-portal-${GITHUB_SHA}.tar.gz" | cut -d ' ' -f1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Retain tested native candidate
        id: native_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-portal-tested-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  native-stage:
    name: Deliver tested candidate to server staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ozon-finance-partial-20261117')
    needs: [native-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: wbozon-native-staging
      cancel-in-progress: false
    steps:
      - name: Verify artifact identity
        env:
          BUILD_ARTIFACT_ID: ${{ needs.native-candidate.outputs.artifact_id }}
          BUILD_ATTEMPT: ${{ needs.native-candidate.outputs.artifact_attempt }}
          BUILD_SHA256: ${{ needs.native-candidate.outputs.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ && "$BUILD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$BUILD_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "::error::Production verifies build and staging in the same attempt. Select Re-run all jobs to build and deliver a fresh artifact."
            exit 1
          fi
      - name: Download exact artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.native-candidate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-artifact
      - name: Deliver candidate to isolated server staging
        env:
          STAGE_SSH_KEY: ${{ secrets.WBOZON_STAGE_SSH_KEY }}
          STAGE_KNOWN_HOSTS: ${{ secrets.WBOZON_STAGE_KNOWN_HOSTS }}
          STAGE_SSH_TARGET: ${{ secrets.WBOZON_STAGE_SSH_TARGET }}
          BUILD_ATTEMPT: ${{ needs.native-candidate.outputs.artifact_attempt }}
          BUILD_SHA256: ${{ needs.native-candidate.outputs.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -n "$STAGE_SSH_KEY"
          test -n "$STAGE_KNOWN_HOSTS"
          if [[ ! "$STAGE_SSH_TARGET" =~ ^[A-Za-z_][A-Za-z0-9_-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::Configure WBOZON_STAGE_SSH_TARGET as user@host."
            exit 1
          fi
          artifact="$RUNNER_TEMP/native-artifact/native-portal-${GITHUB_SHA}.tar.gz"
          test -f "$artifact" && test ! -L "$artifact"
          test -f "$RUNNER_TEMP/native-artifact/SHA256SUMS" && test ! -L "$RUNNER_TEMP/native-artifact/SHA256SUMS"
          test "$(find "$RUNNER_TEMP/native-artifact" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          bytes="$(stat -c '%s' "$artifact")"
          [[ "$bytes" =~ ^[1-9][0-9]*$ ]] && (( bytes <= 30000000 ))
          (( $(stat -c '%s' "$RUNNER_TEMP/native-artifact/SHA256SUMS") <= 200 ))
          digest="$(sha256sum "$artifact" | cut -d ' ' -f1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          test "$digest" = "$BUILD_SHA256"
          test "$(cat "$RUNNER_TEMP/native-artifact/SHA256SUMS")" = "$digest  native-portal-${GITHUB_SHA}.tar.gz"
          private_dir="$RUNNER_TEMP/wbozon-stage-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          mkdir -m 700 "$private_dir"
          trap 'rm -f "$private_dir/key" "$private_dir/known_hosts" "$private_dir/ssh-error"; rmdir "$private_dir"' EXIT
          printf '%s\n' "$STAGE_SSH_KEY" > "$private_dir/key"
          printf '%s\n' "$STAGE_KNOWN_HOSTS" > "$private_dir/known_hosts"
          # Retrying the same identity lets the receiver verify an existing copy or recover a partial file.
          for attempt in 1 2 3; do
            # Leave time for SSH setup as well as the receiver's 180-second deadline.
            if LC_ALL=C timeout --kill-after=5s 300s ssh -T -i "$private_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$private_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o ClearAllForwardings=yes \
              -o ConnectTimeout=90 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
              -- "$STAGE_SSH_TARGET" "stage $GITHUB_SHA $GITHUB_RUN_ID $BUILD_ATTEMPT $digest $bytes" \
              < "$artifact" 2>"$private_dir/ssh-error"; then
              exit 0
            else
              status=$?
            fi
            echo "::warning::Staging SSH exited with status $status."
            if grep -Eiq \
              -e 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED|Permission denied' \
              -e 'Authentication failed|Failed to authenticate|Too many authentication failures|Bad owner or permissions|Load key ' \
              -e 'Rejected staging request|Staging outcome not confirmed' "$private_dir/ssh-error"; then
              exit "$status"
            fi
            if [[ $status == 255 ]]; then
              grep -Eiq -e 'Timeout, server .* not responding|Connection timed out|Operation timed out' \
                -e 'Connection reset by peer|Broken pipe|Connection refused|Network is unreachable' \
                "$private_dir/ssh-error" || exit "$status"
            elif [[ $status != 124 ]]; then
              exit "$status"
            fi
            if [[ $attempt == 3 ]]; then exit "$status"; fi
            echo "::warning::Staging transport interrupted on attempt $attempt. Retrying the verified archive."
            sleep "$((attempt * 10))"
          done

  native-deploy:
    name: Deploy and verify production portal
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-candidate, native-stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: wbozon-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      # This runner never checks out or executes application or artifact code.
      - name: Request verified deployment and wait for production readiness
        shell: bash
        env:
          HOST_KEY: ${{ secrets.WBOZON_STAGE_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.WBOZON_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_TARGET: ${{ secrets.WBOZON_DEPLOY_SSH_TARGET }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.native-candidate.outputs.artifact_id }}
          BUILD_ATTEMPT: ${{ needs.native-candidate.outputs.artifact_attempt }}
          TAR_SHA256: ${{ needs.native-candidate.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SSH_TARGET" =~ ^[A-Za-z_][A-Za-z0-9_-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::Configure WBOZON_DEPLOY_SSH_TARGET as user@host."
            exit 1
          fi
          test -n "$DEPLOY_KEY"
          test -n "$HOST_KEY"
          umask 077
          keys="$(mktemp -d "$RUNNER_TEMP/wbozon-deploy.XXXXXX")"
          trap 'rm -f "$keys/id" "$keys/known_hosts" "$keys/ssh-error"; rmdir "$keys"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keys/id"
          printf '%s\n' "$HOST_KEY" > "$keys/known_hosts"
          unset DEPLOY_KEY HOST_KEY
          for attempt in 1 2 3; do
            if python3 -c 'import json,os,sys; e=os.environ; json.dump(dict(commit=e["GITHUB_SHA"],run_id=e["GITHUB_RUN_ID"],attempt=e["GITHUB_RUN_ATTEMPT"],artifact_id=e["ARTIFACT"],build_attempt=e["BUILD_ATTEMPT"],tar_sha256=e["TAR_SHA256"],token=e["GH_TOKEN"]),sys.stdout)' |
              env -u GH_TOKEN LC_ALL=C ssh -T -i "$keys/id" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keys/known_hosts" \
                -o GlobalKnownHostsFile=/dev/null -o ClearAllForwardings=yes \
                -o ConnectTimeout=90 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
                -- "$DEPLOY_SSH_TARGET" deploy 2>"$keys/ssh-error"; then
              exit 0
            else
              status=$?
            fi
            echo "::warning::Deployment SSH exited with status $status."
            # These messages precede authentication and the remote deployment command.
            # A later disconnect has an uncertain outcome and requires reconciliation.
            if [[ $status != 255 || $attempt == 3 ]] || ! grep -Eq \
              -e '^kex_exchange_identification: (read: Connection reset by peer|Connection closed by remote host)' \
              -e '^Connection timed out during banner exchange' \
              -e '^ssh: connect to host [^[:space:]]+ port [0-9]+: (Connection timed out|Connection refused)$' \
              "$keys/ssh-error"; then
              exit "$status"
            fi
            echo "::warning::SSH disconnected before authentication. Retrying the deployment connection."
            sleep "$((attempt * 10))"
          done
      - name: Verify public health over HTTPS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 20 https://3dprinta.shop/healthz |
            python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok"}'
