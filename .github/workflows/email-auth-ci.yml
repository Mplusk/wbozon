name: Email auth CI

on:
  push:
    paths: ['services/email-auth/**', '.github/workflows/email-auth-*.yml']
  pull_request:
    paths: ['services/email-auth/**', '.github/workflows/email-auth-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Syntax and offline security regressions
        working-directory: services/email-auth
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m compileall -q portal.py smoke.py candidate.py test_portal.py app.py gunicorn.conf.py test_app.py test_release.py deploy/release.py
          python3 -m unittest -v
      - name: Build isolated runtime
        run: docker build --tag email-auth-ci services/email-auth
      - name: Smoke test without real credentials or sending email
        shell: bash
        run: |
          set -euo pipefail
          name="email-auth-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --memory=128m --cpus=.5 --pids-limit=100 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001 \
            --network none \
            email-auth-ci python candidate.py >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$name" python smoke.py >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Isolated runtime did not become ready' >&2
          exit 1
      - name: Export verified image for private isolated testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/bender/email-auth-cicd'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          docker save email-auth-ci | gzip -n > image-artifact/email-auth-image.tar.gz
          (cd image-artifact && sha256sum email-auth-image.tar.gz > SHA256SUMS)
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' email-auth-ci)"
          export IMAGE_ID
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "source_commit": os.environ["GITHUB_SHA"],
              "image_id": os.environ["IMAGE_ID"],
              "image_tag": "email-auth-ci:latest",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "platform": "linux/amd64",
              "purpose": "isolated-test-only; not a production release",
              "credentials": "none; candidate generates temporary synthetic test keys",
          }
          Path("image-artifact/metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - name: Retain private tested image for three days
        if: github.event_name == 'push' && github.ref == 'refs/heads/bender/email-auth-cicd'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: email-auth-image-${{ github.sha }}
          path: image-artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
