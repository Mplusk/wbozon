name: Native manual release controller tests
on:
  push:
    paths: ['tools/native-release/**', '.github/workflows/native-release-tests.yml']
  pull_request:
    paths: ['tools/native-release/**', '.github/workflows/native-release-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline unit tests only, no deployment
        working-directory: tools/native-release
        run: |
          python3 -m py_compile native_release.py test_native_release.py
          python3 -m unittest -v
